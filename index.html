<!-- index.html (single file) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timer + Tagged History</title>
  <style>
    :root{
      --bg:#000;
      --green:#00ff4c;
      --red:#ff2a2a;
      --text:#eaeaea;

      --sheetRadius:22px;
      --sheetPeek:64px;     /* visible bar when collapsed */
      --sheetH:70vh;        /* open height (set via JS too) */
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      overflow:hidden;
    }

    /* Center control */
    .stage{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      padding-bottom: calc(var(--sheetPeek) + 18px);
    }

    .control{
      display:flex;
      align-items:center;
      gap:12px;
    }

    /* Timer text only (no frame/background/border) */
    .timer-wrap{
      display:flex;
      align-items:center;
      justify-content:center;

      /* hidden state */
      max-width:0;
      opacity:0;
      overflow:hidden;
      transform:translateX(14px);
      transition:
        max-width 360ms ease,
        opacity 240ms ease,
        transform 360ms ease;
      will-change:max-width, transform, opacity;
    }

    .timer{
      font-variant-numeric: tabular-nums;
      letter-spacing:0.6px;
      font-size:22px;
      font-weight:800;
      white-space:nowrap;
      user-select:none;
      text-shadow: 0 0 18px rgba(255,255,255,0.12);
    }

    .action-btn{
      width:180px;
      height:64px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      letter-spacing:1px;
      color:#001a08;
      background:var(--green);
      box-shadow:
        0 0 18px rgba(0,255,76,0.28),
        0 0 44px rgba(0,255,76,0.16);
      transition:
        background 220ms ease,
        box-shadow 220ms ease,
        transform 120ms ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active{ transform:scale(0.98); }

    /* Running state */
    .running .timer-wrap{
      max-width:260px;
      opacity:1;
      transform:translateX(0);
    }

    .running .action-btn{
      background:var(--red);
      color:#250000;
      box-shadow:
        0 0 18px rgba(255,42,42,0.28),
        0 0 44px rgba(255,42,42,0.16);
    }

    /* =========================
       History sheet overlay
       ========================= */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      opacity:0;
      pointer-events:none;
      transition:opacity 220ms ease;
    }
    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    /* Bottom sheet */
    .sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:var(--sheetH);
      border-top-left-radius:var(--sheetRadius);
      border-top-right-radius:var(--sheetRadius);
      background:rgba(18,18,18,0.92);
      backdrop-filter: blur(14px);
      box-shadow: 0 -14px 34px rgba(0,0,0,0.55);
      transform: translateY(var(--sheetY, calc(var(--sheetH) - var(--sheetPeek))));
      transition: transform 260ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      touch-action:none; /* dragging handled */
    }
    .sheet.no-transition{ transition:none; }

    .sheet-header{
      height:var(--sheetPeek);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      cursor:pointer;
      user-select:none;
    }

    .handle{
      position:absolute;
      top:10px;
      width:68px;
      height:6px;
      border-radius:999px;
      background:rgba(255,255,255,0.22);
    }

    .sheet-title{
      font-weight:900;
      letter-spacing:0.8px;
      font-size:14px;
      opacity:0.92;
      margin-top:12px;
    }

    .sheet-body{
      flex:1;
      overflow:auto;
      padding:14px 14px 18px;
      -webkit-overflow-scrolling: touch;
    }

    .hint{
      opacity:0.7;
      font-size:13px;
      line-height:1.4;
      padding:10px 6px;
    }

    .history-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:8px;
    }

    .history-item{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:12px 12px;
      border-radius:16px;
      background:rgba(255,255,255,0.06);
    }

    .history-left{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
      flex:1;
    }

    .history-topline{
      display:flex;
      align-items:baseline;
      gap:10px;
      flex-wrap:wrap;
    }

    .history-time{
      font-variant-numeric: tabular-nums;
      font-weight:900;
      letter-spacing:0.4px;
      font-size:16px;
      white-space:nowrap;
    }

    .history-tag{
      font-size:12px;
      font-weight:900;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(0,255,76,0.14);
      color:rgba(0,255,76,0.92);
      white-space:nowrap;
      max-width: 60vw;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .history-meta{
      font-size:12px;
      opacity:0.65;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 78vw;
    }

    .history-notes{
      font-size:12px;
      opacity:0.78;
      line-height:1.35;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 78vw;
    }

    .chip{
      font-size:12px;
      font-weight:900;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,0.10);
      color:rgba(255,255,255,0.78);
      white-space:nowrap;
    }

    /* =========================
       Stop modal
       ========================= */
    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.72);
      opacity:0;
      pointer-events:none;
      transition:opacity 200ms ease;
      display:grid;
      place-items:center;
      padding:18px;
      z-index:50;
    }
    .modal-overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .modal{
      width:min(520px, 100%);
      border-radius:22px;
      background:rgba(20,20,20,0.96);
      box-shadow: 0 18px 60px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.10);
      overflow:hidden;
    }

    .modal-head{
      padding:16px 16px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .modal-title{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .modal-title h2{
      font-size:16px;
      letter-spacing:0.6px;
      font-weight:900;
    }

    .modal-sub{
      font-size:13px;
      opacity:0.75;
      font-variant-numeric: tabular-nums;
      letter-spacing:0.4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 100%;
    }

    .modal-body{
      padding:0 16px 16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    label{
      font-size:12px;
      font-weight:900;
      letter-spacing:0.6px;
      opacity:0.85;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    input, textarea{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      color:var(--text);
      padding:12px 12px;
      outline:none;
      font-size:14px;
    }

    textarea{
      resize:none;
      min-height:96px;
      line-height:1.35;
    }

    input:focus, textarea:focus{
      border-color: rgba(0,255,76,0.35);
      box-shadow: 0 0 0 3px rgba(0,255,76,0.10);
    }

    .modal-actions{
      display:flex;
      gap:10px;
      padding:14px 16px 16px;
      border-top:1px solid rgba(255,255,255,0.10);
      justify-content:flex-end;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:12px 16px;
      font-weight:900;
      letter-spacing:0.6px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms ease, background 180ms ease, box-shadow 180ms ease;
    }
    .btn:active{ transform:scale(0.98); }

    .btn-ghost{
      background:rgba(255,255,255,0.10);
      color:rgba(255,255,255,0.86);
    }
    .btn-save{
      background:rgba(0,255,76,0.92);
      color:#001a08;
      box-shadow: 0 0 18px rgba(0,255,76,0.18);
    }
    .btn-save:disabled{
      opacity:0.45;
      cursor:not-allowed;
      box-shadow:none;
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce){
      .timer-wrap, .action-btn, .overlay, .sheet, .modal-overlay{ transition:none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="control" id="control">
      <div class="timer-wrap" id="timerWrap" aria-hidden="true">
        <div class="timer" id="timer">00:00.00</div>
      </div>

      <button class="action-btn" id="actionBtn" type="button">START</button>
    </div>
  </div>

  <!-- History overlay -->
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <!-- History bottom sheet -->
  <section class="sheet" id="sheet" aria-label="History">
    <div class="sheet-header" id="sheetHeader" role="button" aria-label="Toggle History">
      <div class="handle"></div>
      <div class="sheet-title">HISTORY</div>
    </div>

    <!-- Empty area in sheet body = close gesture target -->
    <div class="sheet-body" id="sheetBody">
      <div class="hint" id="emptyHint">
        Stopped timers will appear here. Swipe down on empty space to close, tap outside to close, or tap the HISTORY bar.
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </section>

  <!-- Stop popup/modal -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Save job">
      <div class="modal-head">
        <div class="modal-title">
          <h2>Save Job</h2>
          <div class="modal-sub" id="modalSub">Duration: 00:00.00</div>
        </div>
      </div>

      <div class="modal-body">
        <div class="field">
          <label for="tagInput">TAG (REQUIRED)</label>
          <input id="tagInput" type="text" placeholder="e.g. Warehouse Shift, Delivery Run" maxlength="40" />
        </div>

        <div class="field">
          <label for="notesInput">NOTES (OPTIONAL)</label>
          <textarea id="notesInput" placeholder="Add notes (optional)"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn" type="button">CANCEL</button>
        <button class="btn btn-save" id="saveBtn" type="button" disabled>SAVE</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================
    // Storage (simple + durable)
    // ==========================
    const LS_KEY = "timer_history_v1";

    function loadHistory(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveHistory(){
      try{
        localStorage.setItem(LS_KEY, JSON.stringify(history));
      } catch {}
    }

    // ==========================
    // Timer logic
    // ==========================
    const control = document.getElementById("control");
    const btn = document.getElementById("actionBtn");
    const timerEl = document.getElementById("timer");

    let running = false;
    let startAt = 0;
    let rafId = null;

    // pending stop data (saved only after modal Save)
    let pendingMs = 0;
    let pendingDisplay = "00:00.00";

    let history = loadHistory(); // { ms, display, whenISO, tag, notes }

    function formatTime(ms){
      const totalCentis = Math.floor(ms / 10); // 10ms = 1 centisecond
      const centis = totalCentis % 100;
      const totalSeconds = Math.floor(totalCentis / 100);
      const seconds = totalSeconds % 60;
      const minutes = Math.floor(totalSeconds / 60);

      const mm = String(minutes).padStart(2, "0");
      const ss = String(seconds).padStart(2, "0");
      const cc = String(centis).padStart(2, "0");
      return `${mm}:${ss}.${cc}`;
    }

    function tick(now){
      const elapsed = now - startAt;
      timerEl.textContent = formatTime(elapsed);
      rafId = requestAnimationFrame(tick);
    }

    function start(){
      running = true;
      control.classList.add("running");
      btn.textContent = "STOP";
      btn.setAttribute("aria-pressed", "true");

      startAt = performance.now();
      timerEl.textContent = "00:00.00";
      rafId = requestAnimationFrame(tick);
    }

    function hardStopTimerCapture(){
      // capture final elapsed before resetting / modal
      pendingMs = Math.max(0, performance.now() - startAt);
      pendingDisplay = formatTime(pendingMs);

      running = false;
      control.classList.remove("running");
      btn.textContent = "START";
      btn.setAttribute("aria-pressed", "false");

      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }

    btn.addEventListener("click", () => {
      if (!running) {
        start();
      } else {
        // STOP clicked -> capture time + open modal
        hardStopTimerCapture();
        openSaveModal();
      }
    });

    // ==========================
    // History rendering
    // ==========================
    const historyList = document.getElementById("historyList");
    const emptyHint = document.getElementById("emptyHint");

    function formatPrettyDate(iso){
      const d = new Date(iso);
      const date = d.toLocaleDateString(undefined, { day:"2-digit", month:"short", year:"numeric" });
      const time = d.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
      return `${date} • ${time}`;
    }

    function renderHistory(){
      historyList.innerHTML = "";
      if (!history.length){
        emptyHint.style.display = "block";
        return;
      }
      emptyHint.style.display = "none";

      for (let i = 0; i < history.length; i++){
        const item = history[i];

        const row = document.createElement("div");
        row.className = "history-item";

        const left = document.createElement("div");
        left.className = "history-left";

        const top = document.createElement("div");
        top.className = "history-topline";

        const t = document.createElement("div");
        t.className = "history-time";
        t.textContent = item.display;

        const tag = document.createElement("div");
        tag.className = "history-tag";
        tag.textContent = item.tag || "Untitled";

        top.appendChild(t);
        top.appendChild(tag);

        const meta = document.createElement("div");
        meta.className = "history-meta";
        meta.textContent = formatPrettyDate(item.whenISO);

        left.appendChild(top);
        left.appendChild(meta);

        if (item.notes && item.notes.trim()){
          const notes = document.createElement("div");
          notes.className = "history-notes";
          notes.textContent = item.notes.trim();
          left.appendChild(notes);
        }

        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = `#${history.length - i}`;

        row.appendChild(left);
        row.appendChild(chip);

        historyList.appendChild(row);
      }
    }

    // ==========================
    // Bottom sheet behavior
    // - Opens to 70% screen
    // - Closes when user swipes down on EMPTY spot (not on items)
    // - Closes when user taps outside
    // - Toggles when user taps header ("HISTORY")
    // ==========================
    const overlay = document.getElementById("overlay");
    const sheet = document.getElementById("sheet");
    const sheetHeader = document.getElementById("sheetHeader");
    const sheetBody = document.getElementById("sheetBody");

    let sheetOpen = false;

    let sheetHeightPx = 0;
    let peekPx = 0;
    let openY = 0;      // translateY when open
    let closedY = 0;    // translateY when collapsed
    let currentY = 0;

    function measureSheet(){
      peekPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sheetPeek")) || 64;
      sheetHeightPx = Math.round(window.innerHeight * 0.70);
      sheet.style.height = sheetHeightPx + "px";
      openY = 0;
      closedY = Math.max(0, sheetHeightPx - peekPx);

      currentY = sheetOpen ? openY : closedY;
      setSheetY(currentY, true);
    }

    function setSheetY(y, immediate=false){
      currentY = Math.min(Math.max(y, openY), closedY);

      if (immediate) sheet.classList.add("no-transition");
      else sheet.classList.remove("no-transition");

      sheet.style.setProperty("--sheetY", `${currentY}px`);

      const isShown = currentY < (closedY - 1);
      overlay.classList.toggle("show", isShown);
      overlay.setAttribute("aria-hidden", String(!isShown));

      if (immediate){
        requestAnimationFrame(() => sheet.classList.remove("no-transition"));
      }
    }

    function openSheet(){
      sheetOpen = true;
      setSheetY(openY, false);
    }

    function closeSheet(){
      sheetOpen = false;
      setSheetY(closedY, false);
    }

    function toggleSheet(){
      sheetOpen ? closeSheet() : openSheet();
    }

    overlay.addEventListener("click", () => closeSheet());
    sheetHeader.addEventListener("click", () => toggleSheet());

    // Dragging / swipe down close on empty spot
    let dragging = false;
    let dragStartY = 0;
    let startSheetY = 0;
    let allowDrag = false;
    let dragDy = 0;

    function onPointerDown(e, source){
      // Allow drag from:
      // - header always
      // - body only if NOT on a history item (empty spot)
      if (source === "header") {
        allowDrag = true;
      } else {
        const inItem = e.target.closest(".history-item");
        allowDrag = !inItem;
      }

      if (!allowDrag) return;

      dragging = true;
      dragDy = 0;
      sheet.classList.add("no-transition");
      dragStartY = e.clientY;
      startSheetY = currentY;

      try { sheet.setPointerCapture(e.pointerId); } catch {}
    }

    function onPointerMove(e){
      if (!dragging) return;
      dragDy = e.clientY - dragStartY;

      const nextY = startSheetY + dragDy;
      setSheetY(nextY, true);
    }

    function onPointerUp(e){
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove("no-transition");

      // If sheet is open and user swiped DOWN on empty spot, close it (low threshold).
      // This is the behavior you asked for: swipe down on open space closes.
      if (sheetOpen && dragDy > 35){
        closeSheet();
      } else if (!sheetOpen && dragDy < -35){
        // If collapsed and user swiped UP, open
        openSheet();
      } else {
        // Otherwise snap to nearest (for mild drags)
        const midpoint = (closedY * 0.5);
        if (currentY < midpoint) openSheet();
        else closeSheet();
      }

      try { sheet.releasePointerCapture(e.pointerId); } catch {}
    }

    sheetHeader.addEventListener("pointerdown", (e) => onPointerDown(e, "header"));
    sheetBody.addEventListener("pointerdown", (e) => onPointerDown(e, "body"));
    sheet.addEventListener("pointermove", onPointerMove);
    sheet.addEventListener("pointerup", onPointerUp);
    sheet.addEventListener("pointercancel", onPointerUp);

    // ==========================
    // Save modal behavior
    // ==========================
    const modalOverlay = document.getElementById("modalOverlay");
    const modalSub = document.getElementById("modalSub");
    const tagInput = document.getElementById("tagInput");
    const notesInput = document.getElementById("notesInput");
    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");

    function openSaveModal(){
      modalSub.textContent = `Duration: ${pendingDisplay}`;
      tagInput.value = "";
      notesInput.value = "";
      saveBtn.disabled = true;

      modalOverlay.classList.add("show");
      modalOverlay.setAttribute("aria-hidden", "false");

      // focus tag
      setTimeout(() => tagInput.focus(), 0);
    }

    function closeSaveModal(){
      modalOverlay.classList.remove("show");
      modalOverlay.setAttribute("aria-hidden", "true");
    }

    function resetAfterStop(){
      // reset timer text after modal action
      timerEl.textContent = "00:00.00";
      pendingMs = 0;
      pendingDisplay = "00:00.00";
    }

    tagInput.addEventListener("input", () => {
      saveBtn.disabled = !(tagInput.value.trim().length > 0);
    });

    cancelBtn.addEventListener("click", () => {
      closeSaveModal();
      resetAfterStop();
    });

    // Click outside modal closes (treat as cancel)
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay){
        closeSaveModal();
        resetAfterStop();
      }
    });

    saveBtn.addEventListener("click", () => {
      const tag = tagInput.value.trim();
      if (!tag) return;

      const notes = notesInput.value || "";
      const when = new Date();

      history.unshift({
        ms: pendingMs,
        display: pendingDisplay,
        whenISO: when.toISOString(),
        tag,
        notes
      });

      saveHistory();
      renderHistory();
      closeSaveModal();
      resetAfterStop();

      // Bring attention to saved item
      openSheet();
    });

    // ==========================
    // Init
    // ==========================
    measureSheet();
    window.addEventListener("resize", measureSheet);

    closeSheet();
    renderHistory();
  </script>
</body>
</html>
