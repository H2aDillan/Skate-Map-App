<!-- index.html (single file) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timer + Tagged History</title>
  <style>
    :root{
      --bg:#000;
      --green:#00ff4c;
      --red:#ff2a2a;
      --text:#eaeaea;

      --sheetRadius:22px;
      --sheetPeek:64px;     /* visible bar when collapsed */
      --sheetH:70vh;        /* open height (set via JS too) */
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      overflow:hidden;
    }

    /* =========================
       Hourly rate (top center)
       ========================= */
    .top-rate{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      z-index:5;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0;
      background:transparent;
      border:none;
      box-shadow:none;
      backdrop-filter:none;
    }

    .top-rate label{
      font-size:12px;
      font-weight:900;
      letter-spacing:0.6px;
      opacity:0.85;
      white-space:nowrap;
      margin:0;
    }

    .rate-input{
      width:96px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.14);
      background:transparent;
      color:var(--text);
      padding:6px 8px;
      outline:none;
      font-size:13px;
      font-weight:900;
      font-variant-numeric: tabular-nums;
      letter-spacing:0.2px;
      text-align:center;
    }

    .rate-input:focus{
      border-color: rgba(0,255,76,0.40);
      box-shadow: 0 0 0 3px rgba(0,255,76,0.08);
    }

    /* Center control */
    .stage{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      padding-top: 56px;
      padding-bottom: calc(var(--sheetPeek) + 18px);
    }

    .control{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .timer-wrap{
      display:flex;
      align-items:center;
      justify-content:center;

      max-width:0;
      opacity:0;
      overflow:hidden;
      transform:translateX(14px);
      transition:
        max-width 360ms ease,
        opacity 240ms ease,
        transform 360ms ease;
      will-change:max-width, transform, opacity;
    }

    .timer{
      font-variant-numeric: tabular-nums;
      letter-spacing:0.6px;
      font-size:22px;
      font-weight:800;
      white-space:nowrap;
      user-select:none;
      text-shadow: 0 0 18px rgba(255,255,255,0.12);
    }

    .earnings-float{
      position:absolute;
      left:50%;
      bottom:76px;
      transform:translate(-50%, 14px);
      opacity:0;
      pointer-events:none;
      transition: transform 320ms ease, opacity 240ms ease;
      will-change: transform, opacity;

      font-variant-numeric: tabular-nums;
      font-weight:900;
      letter-spacing:0.4px;
      font-size:33px; /* 1.5x timer */
      color:rgba(0,255,76,0.95);
      text-shadow:
        0 0 18px rgba(0,255,76,0.22),
        0 0 44px rgba(0,255,76,0.14);
      white-space:nowrap;
    }

    .running .earnings-float{
      opacity:1;
      transform:translate(-50%, 0);
    }

    .action-btn{
      width:180px;
      height:64px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      letter-spacing:1px;
      color:#001a08;
      background:var(--green);
      box-shadow:
        0 0 18px rgba(0,255,76,0.28),
        0 0 44px rgba(0,255,76,0.16);
      transition:
        background 220ms ease,
        box-shadow 220ms ease,
        transform 120ms ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active{ transform:scale(0.98); }

    .running .timer-wrap{
      max-width:260px;
      opacity:1;
      transform:translateX(0);
    }

    .running .action-btn{
      background:var(--red);
      color:#250000;
      box-shadow:
        0 0 18px rgba(255,42,42,0.28),
        0 0 44px rgba(255,42,42,0.16);
    }

    /* =========================
       History sheet overlay
       ========================= */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      opacity:0;
      pointer-events:none;
      transition:opacity 220ms ease;
    }
    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:var(--sheetH);
      border-top-left-radius:var(--sheetRadius);
      border-top-right-radius:var(--sheetRadius);
      background:rgba(18,18,18,0.92);
      backdrop-filter: blur(14px);
      box-shadow: 0 -14px 34px rgba(0,0,0,0.55);
      transform: translateY(var(--sheetY, calc(var(--sheetH) - var(--sheetPeek))));
      transition: transform 260ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      touch-action:none;
    }
    .sheet.no-transition{ transition:none; }

    .sheet-header{
      height:var(--sheetPeek);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      cursor:pointer;
      user-select:none;
      padding:0 14px;
    }

    .handle{
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      width:68px;
      height:6px;
      border-radius:999px;
      background:rgba(255,255,255,0.22);
    }

    .sheet-title{
      font-weight:900;
      letter-spacing:0.8px;
      font-size:14px;
      opacity:0.92;
      margin-top:12px;
    }

    /* NEW: total row under the header bar */
    .sheet-total-row{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      padding:8px 14px 6px;
      border-top:1px solid rgba(255,255,255,0.08);
      border-bottom:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.03);
      user-select:none;
    }

    .sheet-total-label{
      font-size:12px;
      font-weight:900;
      letter-spacing:0.6px;
      color:rgba(255,255,255,0.92); /* "TOTAL" in white */
      white-space:nowrap;
    }

    .sheet-total-value{
      font-variant-numeric: tabular-nums;
      font-weight:900;
      letter-spacing:0.4px;
      font-size:12px;
      color:rgba(0,255,76,0.92);
      text-shadow: 0 0 18px rgba(0,255,76,0.12);
      white-space:nowrap;
    }

    .sheet-body{
      flex:1;
      overflow:auto;
      padding:14px 14px 18px;
      -webkit-overflow-scrolling: touch;
    }

    .hint{
      opacity:0.7;
      font-size:13px;
      line-height:1.4;
      padding:10px 6px;
    }

    .history-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:8px;
    }

    .history-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 12px;
      border-radius:16px;
      background:rgba(255,255,255,0.06);
    }

    .history-left{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
      flex:1;
    }

    .tag-header{
      font-weight:900;
      letter-spacing:0.4px;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 78vw;
      line-height:1.15;
    }

    .duration-line{
      font-variant-numeric: tabular-nums;
      font-weight:900;
      letter-spacing:0.4px;
      font-size:14px;
      opacity:0.95;
      white-space:nowrap;
      line-height:1.15;
    }

    .clock-line{
      font-variant-numeric: tabular-nums;
      font-size:12px;
      opacity:0.75;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 78vw;
      line-height:1.15;
    }

    .date-line{
      font-size:12px;
      opacity:0.65;
      white-space:nowrap;
      line-height:1.15;
    }

    .notes-line{
      font-size:12px;
      opacity:0.78;
      line-height:1.25;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 78vw;
    }

    .history-amount{
      font-variant-numeric: tabular-nums;
      font-weight:900;
      letter-spacing:0.4px;
      font-size:14px;
      color:rgba(0,255,76,0.92);
      white-space:nowrap;
      text-shadow: 0 0 18px rgba(0,255,76,0.14);
      align-self:center;
      padding-left:6px;
    }

    /* =========================
       Stop modal
       ========================= */
    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.72);
      opacity:0;
      pointer-events:none;
      transition:opacity 200ms ease;
      display:grid;
      place-items:center;
      padding:18px;
      z-index:50;
    }
    .modal-overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .modal{
      width:min(520px, 100%);
      border-radius:22px;
      background:rgba(20,20,20,0.96);
      box-shadow: 0 18px 60px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.10);
      overflow:hidden;
    }

    .modal-head{
      padding:16px 16px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .modal-title{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .modal-title h2{
      font-size:16px;
      letter-spacing:0.6px;
      font-weight:900;
    }

    .modal-sub{
      font-size:13px;
      opacity:0.75;
      font-variant-numeric: tabular-nums;
      letter-spacing:0.4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 100%;
    }

    .modal-body{
      padding:0 16px 16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    label{
      font-size:12px;
      font-weight:900;
      letter-spacing:0.6px;
      opacity:0.85;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    input, textarea{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      color:var(--text);
      padding:12px 12px;
      outline:none;
      font-size:14px;
    }

    textarea{
      resize:none;
      min-height:96px;
      line-height:1.35;
    }

    input:focus, textarea:focus{
      border-color: rgba(0,255,76,0.35);
      box-shadow: 0 0 0 3px rgba(0,255,76,0.10);
    }

    .modal-actions{
      display:flex;
      gap:10px;
      padding:14px 16px 16px;
      border-top:1px solid rgba(255,255,255,0.10);
      justify-content:flex-end;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:12px 16px;
      font-weight:900;
      letter-spacing:0.6px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms ease, background 180ms ease, box-shadow 180ms ease;
    }
    .btn:active{ transform:scale(0.98); }

    .btn-ghost{
      background:rgba(255,255,255,0.10);
      color:rgba(255,255,255,0.86);
    }
    .btn-save{
      background:rgba(0,255,76,0.92);
      color:#001a08;
      box-shadow: 0 0 18px rgba(0,255,76,0.18);
    }
    .btn-save:disabled{
      opacity:0.45;
      cursor:not-allowed;
      box-shadow:none;
    }

    @media (prefers-reduced-motion: reduce){
      .timer-wrap, .earnings-float, .action-btn, .overlay, .sheet, .modal-overlay{ transition:none; }
    }
  </style>
</head>
<body>
  <!-- Hourly Rate (top center) -->
  <div class="top-rate" aria-label="Hourly rate">
    <label for="rateInput">HOURLY RATE</label>
    <input id="rateInput" class="rate-input" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" />
  </div>

  <div class="stage">
    <div class="control" id="control">
      <div class="earnings-float" id="earningsFloat">$0.00</div>

      <div class="timer-wrap" id="timerWrap" aria-hidden="true">
        <div class="timer" id="timer">00:00.00</div>
      </div>

      <button class="action-btn" id="actionBtn" type="button">START</button>
    </div>
  </div>

  <!-- History overlay -->
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <!-- History bottom sheet -->
  <section class="sheet" id="sheet" aria-label="History">
    <div class="sheet-header" id="sheetHeader" role="button" aria-label="Toggle History">
      <div class="handle"></div>
      <div class="sheet-title">HISTORY</div>
    </div>

    <!-- NEW total row directly under header bar -->
    <div class="sheet-total-row">
      <div class="sheet-total-label">TOTAL</div>
      <div class="sheet-total-value" id="historyTotal">$0.00</div>
    </div>

    <div class="sheet-body" id="sheetBody">
      <div class="hint" id="emptyHint">
        Stopped timers will appear here. Swipe down on empty space to close, tap outside to close, or tap the HISTORY bar.
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </section>

  <!-- Stop popup/modal -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Save job">
      <div class="modal-head">
        <div class="modal-title">
          <h2>Save Job</h2>
          <div class="modal-sub" id="modalSub">Duration: 00:00.00</div>
        </div>
      </div>

      <div class="modal-body">
        <div class="field">
          <label for="tagInput">TAG (REQUIRED)</label>
          <input id="tagInput" type="text" placeholder="e.g. Warehouse Shift, Delivery Run" maxlength="40" />
        </div>

        <div class="field">
          <label for="notesInput">NOTES (OPTIONAL)</label>
          <textarea id="notesInput" placeholder="Add notes (optional)"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn" type="button">CANCEL</button>
        <button class="btn btn-save" id="saveBtn" type="button" disabled>SAVE</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================
    // Storage
    // ==========================
    const LS_KEY = "timer_history_v3";
    const RATE_KEY = "hourly_rate_v1";

    function loadHistory(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveHistory(){
      try{
        localStorage.setItem(LS_KEY, JSON.stringify(history));
      } catch {}
    }

    function loadRate(){
      try{
        const raw = localStorage.getItem(RATE_KEY);
        const n = raw === null ? NaN : Number(raw);
        return Number.isFinite(n) ? n : 0;
      } catch {
        return 0;
      }
    }

    function saveRate(val){
      try{ localStorage.setItem(RATE_KEY, String(val)); } catch {}
    }

    // ==========================
    // Money helpers
    // ==========================
    function formatMoney(n){
      return `$${n.toFixed(2)}`;
    }

    function calcEarnings(ms, rate){
      const hours = ms / 3600000;
      return hours * rate;
    }

    // ==========================
    // Hourly rate + earnings
    // ==========================
    const rateInput = document.getElementById("rateInput");
    const earningsFloat = document.getElementById("earningsFloat");
    const historyTotalEl = document.getElementById("historyTotal");

    let hourlyRate = loadRate();
    rateInput.value = hourlyRate ? String(hourlyRate) : "";

    function getRate(){
      const v = Number(rateInput.value);
      return Number.isFinite(v) && v > 0 ? v : 0;
    }

    rateInput.addEventListener("input", () => {
      hourlyRate = getRate();
      saveRate(hourlyRate);
    });

    // ==========================
    // Timer logic
    // ==========================
    const control = document.getElementById("control");
    const btn = document.getElementById("actionBtn");
    const timerEl = document.getElementById("timer");

    let running = false;
    let startAtPerf = 0;
    let startAtWall = null;
    let rafId = null;

    // pending stop data
    let pendingMs = 0;
    let pendingDisplay = "00:00.00";
    let pendingClockIn = "";
    let pendingClockOut = "";
    let pendingDate = "";
    let pendingWhenISO = "";
    let pendingAmount = 0;

    let history = loadHistory();

    function formatTime(ms){
      const totalCentis = Math.floor(ms / 10);
      const centis = totalCentis % 100;
      const totalSeconds = Math.floor(totalCentis / 100);
      const seconds = totalSeconds % 60;
      const minutes = Math.floor(totalSeconds / 60);

      const mm = String(minutes).padStart(2, "0");
      const ss = String(seconds).padStart(2, "0");
      const cc = String(centis).padStart(2, "0");
      return `${mm}:${ss}.${cc}`;
    }

    function formatClock(d){
      return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    function formatDateOnly(d){
      return d.toLocaleDateString(undefined, { day:"2-digit", month:"short", year:"numeric" });
    }

    function tick(now){
      const elapsed = now - startAtPerf;
      timerEl.textContent = formatTime(elapsed);

      const earned = calcEarnings(elapsed, hourlyRate);
      earningsFloat.textContent = formatMoney(earned);

      rafId = requestAnimationFrame(tick);
    }

    function start(){
      hourlyRate = getRate();
      saveRate(hourlyRate);

      running = true;
      control.classList.add("running");
      btn.textContent = "STOP";
      btn.setAttribute("aria-pressed", "true");

      startAtPerf = performance.now();
      startAtWall = new Date();
      timerEl.textContent = "00:00.00";
      earningsFloat.textContent = formatMoney(0);

      rafId = requestAnimationFrame(tick);
    }

    function hardStopTimerCapture(){
      const stopWall = new Date();

      pendingMs = Math.max(0, performance.now() - startAtPerf);
      pendingDisplay = formatTime(pendingMs);

      pendingClockIn = startAtWall ? formatClock(startAtWall) : "";
      pendingClockOut = formatClock(stopWall);
      pendingDate = startAtWall ? formatDateOnly(startAtWall) : formatDateOnly(stopWall);

      pendingWhenISO = stopWall.toISOString();
      pendingAmount = calcEarnings(pendingMs, hourlyRate);

      running = false;
      control.classList.remove("running");
      btn.textContent = "START";
      btn.setAttribute("aria-pressed", "false");

      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }

    btn.addEventListener("click", () => {
      if (!running) start();
      else {
        hardStopTimerCapture();
        openSaveModal();
      }
    });

    // ==========================
    // History total
    // ==========================
    function computeHistoryTotal(){
      let sum = 0;
      for (const item of history){
        const amt = Number(item.amount);
        if (Number.isFinite(amt)) sum += amt;
      }
      return sum;
    }

    function renderHistoryTotal(){
      historyTotalEl.textContent = formatMoney(computeHistoryTotal());
    }

    // ==========================
    // History rendering
    // ==========================
    const historyList = document.getElementById("historyList");
    const emptyHint = document.getElementById("emptyHint");

    function renderHistory(){
      historyList.innerHTML = "";
      if (!history.length){
        emptyHint.style.display = "block";
        renderHistoryTotal();
        return;
      }
      emptyHint.style.display = "none";

      for (let i = 0; i < history.length; i++){
        const item = history[i];

        const row = document.createElement("div");
        row.className = "history-item";

        const left = document.createElement("div");
        left.className = "history-left";

        const tagHeader = document.createElement("div");
        tagHeader.className = "tag-header";
        tagHeader.textContent = (item.tag || "Untitled").trim();

        const durationLine = document.createElement("div");
        durationLine.className = "duration-line";
        durationLine.textContent = item.duration || "00:00.00";

        const clockLine = document.createElement("div");
        clockLine.className = "clock-line";
        const ci = item.clockIn || "";
        const co = item.clockOut || "";
        clockLine.textContent = (ci && co) ? `${ci} - ${co}` : "";

        const dateLine = document.createElement("div");
        dateLine.className = "date-line";
        dateLine.textContent = item.date || "";

        const notesLine = document.createElement("div");
        notesLine.className = "notes-line";
        notesLine.textContent = (item.notes || "").trim();

        left.appendChild(tagHeader);
        left.appendChild(durationLine);
        if (clockLine.textContent) left.appendChild(clockLine);
        if (dateLine.textContent) left.appendChild(dateLine);
        if (notesLine.textContent) left.appendChild(notesLine);

        const amountEl = document.createElement("div");
        amountEl.className = "history-amount";
        const amt = Number(item.amount);
        amountEl.textContent = Number.isFinite(amt) ? formatMoney(amt) : formatMoney(0);

        row.appendChild(left);
        row.appendChild(amountEl);
        historyList.appendChild(row);
      }

      renderHistoryTotal();
    }

    // ==========================
    // Bottom sheet behavior
    // ==========================
    const overlay = document.getElementById("overlay");
    const sheet = document.getElementById("sheet");
    const sheetHeader = document.getElementById("sheetHeader");
    const sheetBody = document.getElementById("sheetBody");

    let sheetOpen = false;
    let sheetHeightPx = 0;
    let peekPx = 0;
    let openY = 0;
    let closedY = 0;
    let currentY = 0;

    function measureSheet(){
      peekPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sheetPeek")) || 64;
      sheetHeightPx = Math.round(window.innerHeight * 0.70);
      sheet.style.height = sheetHeightPx + "px";
      openY = 0;
      closedY = Math.max(0, sheetHeightPx - peekPx);

      currentY = sheetOpen ? openY : closedY;
      setSheetY(currentY, true);
    }

    function setSheetY(y, immediate=false){
      currentY = Math.min(Math.max(y, openY), closedY);

      if (immediate) sheet.classList.add("no-transition");
      else sheet.classList.remove("no-transition");

      sheet.style.setProperty("--sheetY", `${currentY}px`);

      const isShown = currentY < (closedY - 1);
      overlay.classList.toggle("show", isShown);
      overlay.setAttribute("aria-hidden", String(!isShown));

      if (immediate){
        requestAnimationFrame(() => sheet.classList.remove("no-transition"));
      }
    }

    function openSheet(){
      sheetOpen = true;
      setSheetY(openY, false);
    }

    function closeSheet(){
      sheetOpen = false;
      setSheetY(closedY, false);
    }

    function toggleSheet(){
      sheetOpen ? closeSheet() : openSheet();
    }

    overlay.addEventListener("click", () => closeSheet());
    sheetHeader.addEventListener("click", () => toggleSheet());

    // Dragging / swipe down close on empty spot
    let dragging = false;
    let dragStartY = 0;
    let startSheetY = 0;
    let allowDrag = false;
    let dragDy = 0;

    function onPointerDown(e, source){
      if (source === "header") {
        allowDrag = true;
      } else {
        const inItem = e.target.closest(".history-item");
        allowDrag = !inItem;
      }
      if (!allowDrag) return;

      dragging = true;
      dragDy = 0;
      sheet.classList.add("no-transition");
      dragStartY = e.clientY;
      startSheetY = currentY;

      try { sheet.setPointerCapture(e.pointerId); } catch {}
    }

    function onPointerMove(e){
      if (!dragging) return;
      dragDy = e.clientY - dragStartY;
      const nextY = startSheetY + dragDy;
      setSheetY(nextY, true);
    }

    function onPointerUp(e){
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove("no-transition");

      if (sheetOpen && dragDy > 35){
        closeSheet();
      } else if (!sheetOpen && dragDy < -35){
        openSheet();
      } else {
        const midpoint = (closedY * 0.5);
        if (currentY < midpoint) openSheet();
        else closeSheet();
      }

      try { sheet.releasePointerCapture(e.pointerId); } catch {}
    }

    sheetHeader.addEventListener("pointerdown", (e) => onPointerDown(e, "header"));
    sheetBody.addEventListener("pointerdown", (e) => onPointerDown(e, "body"));
    sheet.addEventListener("pointermove", onPointerMove);
    sheet.addEventListener("pointerup", onPointerUp);
    sheet.addEventListener("pointercancel", onPointerUp);

    // ==========================
    // Save modal behavior
    // ==========================
    const modalOverlay = document.getElementById("modalOverlay");
    const modalSub = document.getElementById("modalSub");
    const tagInput = document.getElementById("tagInput");
    const notesInput = document.getElementById("notesInput");
    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");

    function openSaveModal(){
      modalSub.textContent = `Duration: ${pendingDisplay}`;
      tagInput.value = "";
      notesInput.value = "";
      saveBtn.disabled = true;

      modalOverlay.classList.add("show");
      modalOverlay.setAttribute("aria-hidden", "false");
      setTimeout(() => tagInput.focus(), 0);
    }

    function closeSaveModal(){
      modalOverlay.classList.remove("show");
      modalOverlay.setAttribute("aria-hidden", "true");
    }

    function resetAfterStop(){
      timerEl.textContent = "00:00.00";
      earningsFloat.textContent = formatMoney(0);

      pendingMs = 0;
      pendingDisplay = "00:00.00";
      pendingClockIn = "";
      pendingClockOut = "";
      pendingDate = "";
      pendingWhenISO = "";
      pendingAmount = 0;
      startAtWall = null;
    }

    tagInput.addEventListener("input", () => {
      saveBtn.disabled = !(tagInput.value.trim().length > 0);
    });

    cancelBtn.addEventListener("click", () => {
      closeSaveModal();
      resetAfterStop();
    });

    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay){
        closeSaveModal();
        resetAfterStop();
      }
    });

    saveBtn.addEventListener("click", () => {
      const tag = tagInput.value.trim();
      if (!tag) return;

      const notes = notesInput.value || "";

      history.unshift({
        duration: pendingDisplay,
        clockIn: pendingClockIn,
        clockOut: pendingClockOut,
        date: pendingDate,
        whenISO: pendingWhenISO,
        tag,
        notes,
        amount: pendingAmount
      });

      saveHistory();
      renderHistory();
      closeSaveModal();
      resetAfterStop();
      openSheet();
    });

    // ==========================
    // Init
    // ==========================
    measureSheet();
    window.addEventListener("resize", measureSheet);

    closeSheet();
    renderHistory(); // also renders total
  </script>
</body>
</html>
