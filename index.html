<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Earnings Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-white: #ffffff;
            --pixel-green: #33ff00;
            --pixel-red: #ff0033;
            --pixel-blue: #3498db;
            --pixel-yellow: #f59e0b;
            --widget-bg: #1a1a1a;
            --sidebar-bg: #111111;
            --widget-border: #444;
            --modal-overlay: rgba(0, 0, 0, 0.9);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            display: flex; flex-direction: column;
            background-color: #000; font-family: 'Press Start 2P', cursive;
            color: var(--pixel-white); overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* MENU ICON */
        .menu-icon { position: absolute; top: 25px; left: 20px; width: 30px; height: 22px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 310; transition: opacity 0.2s; }
        .menu-icon.hidden { opacity: 0; visibility: hidden; }
        .menu-icon div { height: 4px; background-color: var(--pixel-white); width: 100%; }

        /* SIDEBAR */
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 320; }
        .sidebar { position: fixed; top: 0; left: 0; width: 70%; height: 100%; background-color: var(--sidebar-bg); border-right: 6px solid var(--widget-border); transform: translateX(-101%); transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); z-index: 330; display: flex; flex-direction: column; padding: 40px 25px; box-sizing: border-box; }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { font-size: 16px; border-bottom: 4px solid var(--widget-border); padding-bottom: 20px; margin-bottom: 20px; }
        .close-sidebar { position: absolute; top: 20px; right: 20px; font-size: 18px; cursor: pointer; }
        .sidebar-item { font-size: 10px; padding: 15px 0; color: var(--pixel-white); cursor: pointer; }
        .sidebar-item:hover { color: var(--pixel-green); }

        /* RATE INPUT - CENTERED */
        .rate-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10; }
        .rate-label { font-size: 8px; color: #888; }
        .rate-input-wrapper { display: flex; align-items: center; background: #000; border: 3px solid var(--widget-border); padding: 5px 10px; }
        .rate-symbol { font-size: 10px; color: var(--pixel-green); margin-right: 5px; }
        .rate-input { background: transparent; border: none; color: white; font-family: 'Press Start 2P', cursive; font-size: 10px; width: 60px; outline: none; text-align: center; }

        /* MAIN APP AREA */
        .main-app { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; padding-bottom: 80px; }
        #earnings-display { font-size: 24px; color: var(--pixel-green); opacity: 0; transform: translateY(20px); transition: 0.3s; }
        #timer-display { font-size: 28px; color: var(--pixel-white); opacity: 0; transform: translateY(20px); transition: 0.3s; }
        .show-displays #earnings-display, .show-displays #timer-display { opacity: 1; transform: translateY(0); }
        .btn { background-color: var(--pixel-green); color: black; padding: 15px 30px; font-size: 14px; font-family: 'Press Start 2P', cursive; border: 4px solid #006600; cursor: pointer; }
        .btn.stop { background-color: var(--pixel-red); border-color: #660000; color: white; }

        /* MODALS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); display: none; justify-content: center; align-items: center; z-index: 500; }
        .modal-box { background: #222; border: 6px solid var(--pixel-white); padding: 25px; width: 85%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        .modal-input { background: #000; border: 3px solid var(--widget-border); color: white; padding: 10px; font-family: 'Press Start 2P', cursive; font-size: 8px; outline: none; width: 100%; box-sizing: border-box; }

        /* HISTORY DASHBOARD - STRICT HIDE LOGIC */
        .widget-box { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 420px; background-color: var(--widget-bg); 
            border: 4px solid var(--widget-border); border-bottom: none; 
            transition: height 0.4s ease; height: 60px; z-index: 50; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        .widget-box.open { height: 70%; }
        
        .widget-header { 
            height: 60px; min-height: 60px; display: flex; 
            align-items: center; justify-content: center; /* Centered title when closed */
            padding: 0 15px; font-size: 10px; cursor: pointer; flex-shrink: 0; 
        }
        .widget-box.open .widget-header { justify-content: space-between; }
        
        .dash-controls { display: none; gap: 10px; }
        .widget-box.open .dash-controls { display: flex; }
        .dash-btn { padding: 5px 8px; font-size: 8px; font-family: 'Press Start 2P', cursive; cursor: pointer; color: white; border: 2px solid; }

        /* Content fully hidden when not open */
        .widget-content { display: none; flex: 1; overflow-y: auto; padding: 10px 15px; opacity: 0; transition: opacity 0.3s; }
        .widget-box.open .widget-content { display: block; opacity: 1; }

        /* HISTORY ITEMS */
        .history-item { padding: 15px 0; border-bottom: 2px solid #333; display: flex; align-items: center; gap: 15px; }
        .select-box { display: none; width: 18px; height: 18px; border: 2px solid #444; flex-shrink: 0; }
        .delete-mode .select-box, .edit-mode .select-box { display: block; }
        .selected-del { background: rgba(255,0,0,0.15); border-left: 4px solid var(--pixel-red); padding-left: 10px; }
        .selected-edit { background: rgba(245,158,11,0.2); border-left: 4px solid var(--pixel-yellow); padding-left: 10px; }

        #confirm-delete-bar { display: none; background: var(--pixel-red); color: white; padding: 12px; text-align: center; font-size: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="menu-icon" id="menu-btn"><div></div><div></div><div></div></div>

    <div id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="close-sidebar" id="close-x">X</div>
        <div class="sidebar-header">MENU</div>
        <ul style="list-style:none; padding:0; flex-grow:1;">
            <li class="sidebar-item">GOALS</li>
            <li class="sidebar-item">PREDICTIONS</li>
            <li class="sidebar-item">CALENDAR</li>
            <li class="sidebar-item">CALCULATOR</li>
            <li class="sidebar-item">BILLS/EXPENSES</li>
        </ul>
        <div style="display:flex; justify-content:flex-end;"><button class="btn" id="open-settings" style="font-size:8px; padding:10px; background:var(--pixel-blue); border-color:#2980b9; color:white;">SETTINGS</button></div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box">
            <div style="color:var(--pixel-green); text-align:center; font-size:10px; margin-bottom:10px;">SETTINGS</div>
            <label style="font-size:7px; color:#888;">CURRENCY</label>
            <select id="currency-select" class="modal-input">
                <option value="$">$ USD</option><option value="€">€ EUR</option><option value="£">£ GBP</option><option value="¥">¥ JPY</option><option value="R">R ZAR</option>
            </select>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <span style="font-size:7px;">TAG POP UP</span>
                <button id="tag-toggle-btn" class="dash-btn" style="background:#222; border-color:#444; color:white; min-width:60px;">ON</button>
            </div>
            <button class="btn" onclick="document.getElementById('settings-modal').style.display='none'" style="width:100%; margin-top:15px; font-size:10px;">CLOSE</button>
        </div>
    </div>

    <div class="rate-container">
        <div class="rate-label">RATE/HR</div>
        <div class="rate-input-wrapper">
            <span class="rate-symbol" id="symbol-label">$</span>
            <input type="number" id="hourly-rate" class="rate-input" value="25">
        </div>
    </div>

    <div class="main-app" id="app-container">
        <div id="earnings-display">$0.00</div>
        <div id="timer-display">00:00.00</div>
        <button id="action-btn" class="btn">START GAME</button>
    </div>

    <div class="modal-overlay" id="log-modal">
        <div class="modal-box">
            <div style="color:var(--pixel-green); text-align:center; font-size:10px;">SAVE LOG</div>
            <input type="text" id="tag-input" class="modal-input" placeholder="TAG NAME...">
            <input type="text" id="note-input" class="modal-input" placeholder="NOTES...">
            <button id="save-log-btn" class="btn" style="width:100%">SAVE</button>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <div style="color:var(--pixel-yellow); text-align:center; font-size:10px;">EDIT ENTRY</div>
            <input type="text" id="edit-tag" class="modal-input" placeholder="TAG">
            <input type="text" id="edit-date" class="modal-input" placeholder="DATE">
            <div style="display:flex; gap:10px;"><input type="text" id="edit-start" class="modal-input" placeholder="START"><input type="text" id="edit-end" class="modal-input" placeholder="END"></div>
            <input type="text" id="edit-note" class="modal-input" placeholder="NOTES">
            <button id="save-edit-btn" class="btn" style="width:100%; background:var(--pixel-yellow); border-color:#b45309;">UPDATE</button>
            <button class="btn" onclick="document.getElementById('edit-modal').style.display='none'" style="width:100%; background:#444;">CANCEL</button>
        </div>
    </div>

    <div class="widget-box" id="history-widget">
        <div class="widget-header" id="widget-header">
            <span id="history-title" style="color:#888;">HISTORY</span>
            <div class="dash-controls">
                <button class="dash-btn" id="edit-mode-btn" style="background:var(--pixel-yellow); color:black; border-color:#b45309;">EDIT</button>
                <button class="dash-btn" id="del-mode-btn" style="background:var(--pixel-red); color:white; border-color:#660000;">DEL</button>
            </div>
        </div>
        <div class="widget-content" id="history-content">
            <ul id="history-list" style="list-style:none; padding:0; margin:0;"></ul>
        </div>
        <div id="confirm-delete-bar">REMOVE SELECTED</div>
    </div>

    <script>
        let startTime, timerInterval, currentCurrency = "$", isDelMode = false, isEditMode = false, tagPop = true;
        let sStart, sEnd, lDur, lEarn, editingId = null;
        let logs = JSON.parse(localStorage.getItem('pixelLogs')) || [];

        window.onload = () => {
            currentCurrency = localStorage.getItem('pixelCurr') || "$";
            document.getElementById('symbol-label').innerHTML = currentCurrency;
            document.getElementById('currency-select').value = currentCurrency;
            document.getElementById('hourly-rate').value = localStorage.getItem('pixelRate') || "25";
            tagPop = localStorage.getItem('tagPop') !== "false";
            document.getElementById('tag-toggle-btn').innerHTML = tagPop ? "ON" : "OFF";
            renderLogs();
        };

        function saveState() {
            localStorage.setItem('pixelLogs', JSON.stringify(logs));
            localStorage.setItem('pixelCurr', currentCurrency);
            localStorage.setItem('pixelRate', document.getElementById('hourly-rate').value);
            localStorage.setItem('tagPop', tagPop);
        }

        function renderLogs() {
            const list = document.getElementById('history-list'); list.innerHTML = "";
            logs.slice().reverse().forEach(log => {
                const li = document.createElement('li'); li.className = 'history-item';
                li.innerHTML = `<div class="select-box"></div><div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                    <div style="display:flex; justify-content:space-between; font-size:10px;"><span>${log.tag}</span><span style="color:var(--pixel-green);">${log.earnings}</span></div>
                    <div style="display:flex; justify-content:space-between; font-size:7px; color:#888;"><span>${log.date} | ${log.duration}</span><span>${log.start} - ${log.end}</span></div>
                    ${log.note ? `<div style="font-size:7px; color:#666; margin-top:4px;">> ${log.note}</div>` : ""}</div>`;
                li.onclick = () => {
                    if (isDelMode) { li.classList.toggle('selected-del'); updateDelBar(); }
                    else if (isEditMode) { 
                        document.querySelectorAll('.history-item').forEach(i => i.classList.remove('selected-edit'));
                        li.classList.add('selected-edit'); setTimeout(() => openEdit(log.id), 500);
                    }
                };
                list.appendChild(li);
            });
        }

        function updateDelBar() {
            const count = document.querySelectorAll('.selected-del').length;
            document.getElementById('confirm-delete-bar').style.display = count > 0 ? 'block' : 'none';
            document.getElementById('confirm-delete-bar').innerHTML = `REMOVE ${count} ENTRIES`;
        }

        function openEdit(id) {
            const log = logs.find(l => l.id === id);
            editingId = id;
            document.getElementById('edit-tag').value = log.tag;
            document.getElementById('edit-date').value = log.date;
            document.getElementById('edit-start').value = log.start;
            document.getElementById('edit-end').value = log.end;
            document.getElementById('edit-note').value = log.note || "";
            document.getElementById('edit-modal').style.display = 'flex';
            toggleMode('edit'); 
        }

        document.getElementById('save-edit-btn').onclick = () => {
            const log = logs.find(l => l.id === editingId);
            log.tag = document.getElementById('edit-tag').value;
            log.date = document.getElementById('edit-date').value;
            log.start = document.getElementById('edit-start').value;
            log.end = document.getElementById('edit-end').value;
            log.note = document.getElementById('edit-note').value;
            const [h1, m1] = log.start.split(':').map(Number);
            const [h2, m2] = log.end.split(':').map(Number);
            let diff = ((h2*60+m2)-(h1*60+m1))*60000;
            if (diff < 0) diff += 86400000;
            log.earnings = currentCurrency + ((diff/3600000)*document.getElementById('hourly-rate').value).toFixed(2);
            log.duration = `${Math.floor(diff/3600000).toString().padStart(2,'0')}:${Math.floor((diff/60000)%60).toString().padStart(2,'0')}.00`;
            saveState(); renderLogs(); document.getElementById('edit-modal').style.display = 'none';
        };

        function toggleMode(mode) {
            if (mode === 'del') { isDelMode = !isDelMode; isEditMode = false; }
            else { isEditMode = !isEditMode; isDelMode = false; }
            document.getElementById('history-list').className = isDelMode ? 'delete-mode' : (isEditMode ? 'edit-mode' : '');
            document.getElementById('confirm-delete-bar').style.display = 'none';
            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('selected-del', 'selected-edit'));
        }

        document.getElementById('del-mode-btn').onclick = (e) => { e.stopPropagation(); toggleMode('del'); };
        document.getElementById('edit-mode-btn').onclick = (e) => { e.stopPropagation(); toggleMode('edit'); };

        document.getElementById('action-btn').onclick = function() {
            if (this.innerHTML === "START GAME") {
                sStart = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
                document.getElementById('app-container').classList.add('show-displays');
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const mm = Math.floor(elapsed/60000).toString().padStart(2,'0'), ss = Math.floor((elapsed%60000)/1000).toString().padStart(2,'0'), ms = Math.floor((elapsed%1000)/10).toString().padStart(2,'0');
                    document.getElementById('timer-display').innerHTML = `${mm}:${ss}.${ms}`;
                    document.getElementById('earnings-display').innerHTML = currentCurrency + ((elapsed/3600000)*document.getElementById('hourly-rate').value).toFixed(2);
                }, 10);
                this.innerHTML = "STOP GAME"; this.classList.add('stop');
            } else {
                sEnd = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
                lDur = document.getElementById('timer-display').innerHTML; lEarn = document.getElementById('earnings-display').innerHTML;
                clearInterval(timerInterval); document.getElementById('app-container').classList.remove('show-displays');
                this.innerHTML = "START GAME"; this.classList.remove('stop');
                if (tagPop) { document.getElementById('log-modal').style.display = 'flex'; document.getElementById('tag-input').focus(); }
                else addEntry(lDur, lEarn, "no tag", "", new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'}));
            }
        };

        function addEntry(duration, earnings, tag, note, date) {
            logs.push({ id: Date.now(), tag, earnings, duration, date, start: sStart, end: sEnd, note });
            saveState(); renderLogs(); document.getElementById('log-modal').style.display = 'none';
        }

        document.getElementById('save-log-btn').onclick = () => {
            const t = document.getElementById('tag-input');
            addEntry(lDur, lEarn, t.value.trim()===""?"no tag":t.value.toUpperCase(), document.getElementById('note-input').value.trim(), new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'}));
            t.value = ""; document.getElementById('note-input').value = "";
        };

        document.getElementById('confirm-delete-bar').onclick = () => {
            document.querySelectorAll('.selected-del').forEach(el => {
                const tag = el.querySelector('.item-data span').innerText;
                logs = logs.filter(l => l.tag !== tag);
            });
            saveState(); renderLogs(); toggleMode('del');
        };

        // SIDEBAR & WIDGET TOGGLE
        const menuBtn = document.getElementById('menu-btn');
        menuBtn.onclick = () => { document.getElementById('sidebar').classList.add('open'); menuBtn.classList.add('hidden'); document.getElementById('sidebar-overlay').style.display='block'; };
        const closeSide = () => { document.getElementById('sidebar').classList.remove('open'); menuBtn.classList.remove('hidden'); document.getElementById('sidebar-overlay').style.display='none'; };
        document.getElementById('sidebar-overlay').onclick = closeSide;
        document.getElementById('close-x').onclick = closeSide;
        document.getElementById('open-settings').onclick = () => document.getElementById('settings-modal').style.display='flex';
        document.getElementById('tag-toggle-btn').onclick = function() { tagPop = !tagPop; this.innerHTML = tagPop ? "ON" : "OFF"; saveState(); };
        document.getElementById('currency-select').onchange = (e) => { currentCurrency = e.target.value; document.getElementById('symbol-label').innerHTML = currentCurrency; saveState(); };
        
        document.getElementById('widget-header').onclick = () => { 
            if(!isDelMode && !isEditMode) {
                const widget = document.getElementById('history-widget');
                widget.classList.toggle('open');
                document.getElementById('history-title').innerHTML = widget.classList.contains('open') ? "HISTORY_LOG ▲" : "HISTORY";
            }
        };
    </script>
</body>
</html>
