<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Earnings Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-white: #ffffff;
            --pixel-green: #33ff00;
            --pixel-red: #ff0033;
            --pixel-blue: #3498db;
            --pixel-yellow: #f59e0b;
            --widget-bg: #1a1a1a;
            --sidebar-bg: #111111;
            --widget-border: #444;
            --modal-overlay: rgba(0, 0, 0, 0.9);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            display: flex; flex-direction: column;
            background-color: #000; font-family: 'Press Start 2P', cursive;
            color: var(--pixel-white); overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- MENU & SIDEBAR --- */
        .menu-icon { 
            position: absolute; top: 25px; left: 20px; 
            width: 30px; height: 22px; display: flex; 
            flex-direction: column; justify-content: space-between; 
            cursor: pointer; z-index: 310; transition: opacity 0.2s; 
        }
        .menu-icon.hidden { opacity: 0; visibility: hidden; }
        .menu-icon div { height: 4px; background-color: var(--pixel-white); width: 100%; }

        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 320; }
        .sidebar { 
            position: fixed; top: 0; left: 0; width: 70%; height: 100%; 
            background-color: var(--sidebar-bg); border-right: 6px solid var(--widget-border); 
            transform: translateX(-101%); transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
            z-index: 330; display: flex; flex-direction: column; padding: 40px 25px; box-sizing: border-box; 
        }
        .sidebar.open { transform: translateX(0); }
        .close-sidebar { position: absolute; top: 20px; right: 20px; font-size: 18px; cursor: pointer; color: white; }
        .sidebar-item { font-size: 10px; padding: 15px 0; color: var(--pixel-white); cursor: pointer; list-style: none; text-transform: uppercase; }
        .sidebar-item:hover { color: var(--pixel-green); }
        .sidebar-footer { margin-top: auto; display: flex; justify-content: flex-end; }
        .settings-btn { background-color: var(--pixel-blue); color: white; border: 4px solid #2980b9; padding: 10px 15px; font-family: 'Press Start 2P'; font-size: 8px; cursor: pointer; }

        /* --- HOURLY RATE BOX (Restored Clean Look) --- */
        .rate-container { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10; 
        }
        .rate-label { font-size: 8px; color: #888; }
        .rate-input-wrapper { 
            display: flex; align-items: center; background: #000; 
            border: 3px solid var(--widget-border); padding: 5px 10px; 
        }
        .rate-symbol { font-size: 10px; color: var(--pixel-green); margin-right: 5px; }
        .rate-input { 
            background: transparent; border: none; color: white; 
            font-family: 'Press Start 2P'; font-size: 10px; width: 60px; 
            outline: none; text-align: center; 
        }

        /* --- MAIN APP AREA --- */
        .main-app { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; padding-bottom: 80px; }
        #earnings-display { font-size: 24px; color: var(--pixel-green); opacity: 0; transform: translateY(20px); transition: 0.3s; }
        #timer-display { font-size: 28px; color: var(--pixel-white); opacity: 0; transform: translateY(20px); transition: 0.3s; }
        .show-displays #earnings-display, .show-displays #timer-display { opacity: 1; transform: translateY(0); }
        .btn { background-color: var(--pixel-green); color: black; padding: 15px 30px; font-size: 14px; font-family: 'Press Start 2P'; border: 4px solid #006600; cursor: pointer; }
        .btn.stop { background-color: var(--pixel-red); border-color: #660000; color: white; }

        /* --- HISTORY DASHBOARD --- */
        .widget-box { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 90%; max-width: 420px; background-color: var(--widget-bg); border: 4px solid var(--widget-border); border-bottom: none; transition: height 0.4s; height: 60px; z-index: 50; display: flex; flex-direction: column; overflow: hidden; }
        .widget-box.open { height: 75%; }
        .widget-header { height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 15px; font-size: 10px; cursor: pointer; flex-shrink: 0; }
        .widget-box.open .widget-header { justify-content: space-between; border-bottom: 2px solid #333; }
        .dash-controls { display: none !important; gap: 10px; }
        .widget-box.open .dash-controls { display: flex !important; }
        .dash-btn { padding: 5px 8px; font-size: 8px; font-family: 'Press Start 2P'; cursor: pointer; color: white; border: 2px solid; }
        #dash-total-display { display: none; font-size: 8px; color: var(--pixel-green); text-align: center; padding: 15px 0; background: #000; border-bottom: 2px solid #333; }
        .widget-box.open #dash-total-display { display: block; }
        .widget-content { display: none; flex: 1; overflow-y: auto; padding: 10px 15px; }
        .widget-box.open .widget-content { display: block; }
        .history-item { padding: 15px 0; border-bottom: 2px solid #333; display: flex; align-items: center; gap: 15px; }
        .selected-del { background: rgba(255,0,0,0.15); border-left: 4px solid var(--pixel-red); padding-left: 10px; }
        .selected-edit { background: rgba(245,158,11,0.2); border-left: 4px solid var(--pixel-yellow); padding-left: 10px; }
        #confirm-delete-bar { display: none; background: var(--pixel-red); color: white; padding: 12px; text-align: center; font-size: 8px; cursor: pointer; border-top: 4px solid #660000; }

        /* --- GOALS PAGE --- */
        #goals-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 400; display: none; flex-direction: column; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        .goals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 4px solid #222; padding-bottom: 15px; }
        .goal-section-title { font-size: 9px; color: var(--pixel-blue); margin: 20px 0 15px 0; }
        .goal-card { background: #111; border: 2px solid #222; padding: 15px; margin-bottom: 15px; }
        .goal-info { display: flex; justify-content: space-between; font-size: 7px; margin-bottom: 10px; color: #666; }
        .goal-input { background: #000; border: 2px solid #333; color: var(--pixel-green); font-family: 'Press Start 2P'; font-size: 9px; width: 80px; padding: 6px; text-align: center; outline: none; }
        .progress-container { width: 100%; height: 14px; background: #000; border: 2px solid #333; overflow: hidden; position: relative; }
        .progress-liquid { height: 100%; width: 0%; background: var(--pixel-green); transition: width 0.3s ease; box-shadow: 0 0 10px var(--pixel-green); }

        /* --- MODALS --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); display: none; justify-content: center; align-items: center; z-index: 600; }
        .modal-box { background: #1a1a1a; border: 6px solid var(--pixel-white); padding: 25px; width: 85%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        .modal-input { background: #000; border: 3px solid #333; color: white; padding: 10px; font-family: 'Press Start 2P'; font-size: 8px; outline: none; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="menu-icon" id="menu-btn"><div></div><div></div><div></div></div>

    <div id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="close-sidebar" id="close-x">X</div>
        <div class="sidebar-header">MENU</div>
        <ul class="sidebar-list">
            <li class="sidebar-item" id="menu-goals">GOALS</li>
            <li class="sidebar-item" style="color:#444;">CALCULATOR</li>
            <li class="sidebar-item" style="color:#444;">BILLS/EXPENSES</li>
        </ul>
        <div class="sidebar-footer">
            <button class="settings-btn" id="open-settings-btn">SETTINGS</button>
        </div>
    </div>

    <div class="rate-container">
        <div class="rate-label">RATE/HR</div>
        <div class="rate-input-wrapper">
            <span class="rate-symbol" id="symbol-label">$</span>
            <input type="number" id="hourly-rate" class="rate-input" value="25">
        </div>
    </div>

    <div class="main-app" id="app-container">
        <div id="earnings-display">$0.00</div>
        <div id="timer-display">00:00.00</div>
        <button id="action-btn" class="btn">START GAME</button>
    </div>

    <div class="widget-box" id="history-widget">
        <div class="widget-header" id="widget-header">
            <span id="history-title" style="color:#888;">HISTORY</span>
            <div class="dash-controls">
                <button class="dash-btn" id="edit-mode-btn" style="background:var(--pixel-yellow); color:black; border-color:#b45309;">EDIT</button>
                <button class="dash-btn" id="del-mode-btn" style="background:var(--pixel-red); color:white; border-color:#660000;">DEL</button>
            </div>
        </div>
        <div id="dash-total-display">TOTAL EARNED: $0.00</div>
        <div class="widget-content"><ul id="history-list" style="list-style:none; padding:0; margin:0;"></ul></div>
        <div id="confirm-delete-bar">REMOVE SELECTED</div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box">
            <div style="color:var(--pixel-green); text-align:center; font-size:10px;">SETTINGS</div>
            <label style="font-size:7px; color:#888;">CURRENCY</label>
            <select id="currency-select" class="modal-input">
                <option value="$">$ USD</option><option value="€">€ EUR</option><option value="£">£ GBP</option><option value="¥">¥ JPY</option>
            </select>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <span style="font-size:7px;">TAG POP UP</span>
                <button id="tag-toggle-btn" class="btn" style="padding:5px; font-size:8px; width:60px; background:#222; border-color:#444; color:white;">ON</button>
            </div>
            <button class="btn" onclick="document.getElementById('settings-modal').style.display='none'" style="width:100%; margin-top:10px;">CLOSE</button>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <div style="color:var(--pixel-yellow); text-align:center; font-size:10px;">EDIT ENTRY</div>
            <input type="text" id="edit-tag" class="modal-input"><input type="text" id="edit-date" class="modal-input">
            <div style="display:flex; gap:10px;"><input type="text" id="edit-start" class="modal-input"><input type="text" id="edit-end" class="modal-input"></div>
            <button id="save-edit-btn" class="btn" style="width:100%; background:var(--pixel-yellow); border-color:#b45309;">UPDATE</button>
        </div>
    </div>

    <div class="modal-overlay" id="log-modal">
        <div class="modal-box">
            <div style="color:var(--pixel-green); text-align:center; font-size:10px;">SAVE LOG</div>
            <input type="text" id="tag-input" class="modal-input" placeholder="TAG NAME...">
            <input type="text" id="note-input" class="modal-input" placeholder="NOTES...">
            <button id="save-log-btn" class="btn" style="width:100%">SAVE</button>
        </div>
    </div>

    <div id="goals-page">
        <div class="goals-header"><span>GOALS</span><span id="close-goals" style="cursor:pointer; color:var(--pixel-red);">BACK</span></div>
        <div class="goal-section-title">STANDARD OBJECTIVES</div>
        <div id="std-goal-container"></div>
        <div class="goal-section-title">CUSTOM TIMEFRAMES</div>
        <button class="btn" id="add-custom-goal" style="width:100%; font-size:7px; margin-bottom:20px; background:var(--pixel-blue); border-color:#2980b9; color:white;">+ ADD TIMEFRAME</button>
        <div id="custom-goal-container"></div>
    </div>

    <div class="modal-overlay" id="custom-goal-modal">
        <div class="modal-box">
            <div style="color:var(--pixel-blue); text-align:center; font-size:10px;">NEW GOAL</div>
            <input type="number" id="cg-target" class="modal-input" placeholder="TARGET AMOUNT">
            <input type="number" id="cg-days" class="modal-input" placeholder="DURATION (DAYS)">
            <button id="cg-save" class="btn" style="width:100%">CREATE</button>
        </div>
    </div>

    <script>
        let startTime, timerInterval, currentCurrency = "$", isDelMode = false, isEditMode = false, tagPop = true;
        let sStart, sEnd, lDur, lEarn, liveEarnings = 0, editingId = null;
        let logs = JSON.parse(localStorage.getItem('pixelLogs')) || [];
        let goalTargets = JSON.parse(localStorage.getItem('goalTargets')) || { Daily: 100, Weekly: 500, Monthly: 2000, Yearly: 20000 };
        let customGoals = JSON.parse(localStorage.getItem('customGoals')) || [];

        window.onload = () => {
            currentCurrency = localStorage.getItem('pixelCurr') || "$";
            document.getElementById('symbol-label').innerHTML = currentCurrency;
            document.getElementById('currency-select').value = currentCurrency;
            document.getElementById('hourly-rate').value = localStorage.getItem('pixelRate') || "25";
            tagPop = localStorage.getItem('tagPop') !== "false";
            document.getElementById('tag-toggle-btn').innerHTML = tagPop ? "ON" : "OFF";
            renderLogs(); initGoals();
        };

        function saveState() {
            localStorage.setItem('pixelLogs', JSON.stringify(logs));
            localStorage.setItem('pixelCurr', currentCurrency);
            localStorage.setItem('pixelRate', document.getElementById('hourly-rate').value);
            localStorage.setItem('tagPop', tagPop);
            localStorage.setItem('goalTargets', JSON.stringify(goalTargets));
            localStorage.setItem('customGoals', JSON.stringify(customGoals));
        }

        // --- DASHBOARD ---
        document.getElementById('widget-header').onclick = function() {
            const w = document.getElementById('history-widget'); w.classList.toggle('open');
            if(!w.classList.contains('open')) { isEditMode = false; isDelMode = false; document.getElementById('history-list').className = ""; document.getElementById('confirm-delete-bar').style.display="none";}
            document.getElementById('history-title').innerHTML = w.classList.contains('open') ? "HISTORY_LOG ▲" : "HISTORY";
            calculateTotal();
        };

        function toggleMode(mode) {
            if (mode === 'del') { isDelMode = !isDelMode; isEditMode = false; }
            else { isEditMode = !isEditMode; isDelMode = false; }
            document.getElementById('history-list').className = isDelMode ? 'delete-mode' : (isEditMode ? 'edit-mode' : '');
            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('selected-del', 'selected-edit'));
            document.getElementById('confirm-delete-bar').style.display = 'none';
        }
        document.getElementById('del-mode-btn').onclick = (e) => { e.stopPropagation(); toggleMode('del'); };
        document.getElementById('edit-mode-btn').onclick = (e) => { e.stopPropagation(); toggleMode('edit'); };

        function renderLogs() {
            const list = document.getElementById('history-list'); list.innerHTML = "";
            logs.slice().reverse().forEach(log => {
                const li = document.createElement('li'); li.className = 'history-item';
                li.innerHTML = `<div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                    <div style="display:flex; justify-content:space-between; font-size:10px;"><span>${log.tag}</span><span style="color:var(--pixel-green);">${log.earnings}</span></div>
                    <div style="display:flex; justify-content:space-between; font-size:7px; color:#888;"><span>${log.date} | ${log.duration}</span><span>${log.start} - ${log.end}</span></div></div>`;
                li.onclick = () => {
                    if (isDelMode) { li.classList.toggle('selected-del'); const c = document.querySelectorAll('.selected-del').length; document.getElementById('confirm-delete-bar').style.display = c > 0 ? 'block' : 'none'; }
                    else if (isEditMode) {
                        li.classList.add('selected-edit');
                        setTimeout(() => { editingId = log.id; document.getElementById('edit-tag').value = log.tag; document.getElementById('edit-date').value = log.date; document.getElementById('edit-start').value = log.start; document.getElementById('edit-end').value = log.end; document.getElementById('edit-modal').style.display = 'flex'; toggleMode('edit'); }, 500);
                    }
                };
                list.appendChild(li);
            });
            calculateTotal();
        }

        function calculateTotal() {
            const sum = logs.reduce((t, l) => t + (parseFloat(l.earnings.replace(/[^\d.-]/g, '')) || 0), 0);
            document.getElementById('dash-total-display').innerHTML = `TOTAL EARNED: ${currentCurrency}${sum.toFixed(2)}`;
        }

        // --- TIMER ---
        document.getElementById('action-btn').onclick = function() {
            if (this.innerHTML === "START GAME") {
                sStart = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
                document.getElementById('app-container').classList.add('show-displays');
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const mm = Math.floor(elapsed/60000).toString().padStart(2,'0'), ss = Math.floor((elapsed%60000)/1000).toString().padStart(2,'0'), ms = Math.floor((elapsed%1000)/10).toString().padStart(2,'0');
                    document.getElementById('timer-display').innerHTML = `${mm}:${ss}.${ms}`;
                    liveEarnings = (elapsed / 3600000) * (parseFloat(document.getElementById('hourly-rate').value) || 0);
                    document.getElementById('earnings-display').innerHTML = currentCurrency + liveEarnings.toFixed(2);
                    updateGoalBars();
                }, 10);
                this.innerHTML = "STOP GAME"; this.classList.add('stop');
            } else {
                sEnd = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
                lDur = document.getElementById('timer-display').innerHTML; lEarn = document.getElementById('earnings-display').innerHTML;
                clearInterval(timerInterval); liveEarnings = 0;
                document.getElementById('app-container').classList.remove('show-displays');
                this.innerHTML = "START GAME"; this.classList.remove('stop');
                if (tagPop) { document.getElementById('log-modal').style.display='flex'; document.getElementById('tag-input').focus(); }
                else addEntry(lDur, lEarn, "no tag", "", new Date().toLocaleDateString());
            }
        };

        // --- GOALS ---
        function initGoals() {
            const std = document.getElementById('std-goal-container'); const cust = document.getElementById('custom-goal-container');
            std.innerHTML = ""; cust.innerHTML = "";
            Object.keys(goalTargets).forEach(key => renderGoalCard(std, key, goalTargets[key], false));
            customGoals.forEach((cg, i) => renderGoalCard(cust, `${cg.days}D GOAL`, cg.target, true, i));
            updateGoalBars();
        }

        function renderGoalCard(container, label, target, isCustom, idx) {
            const card = document.createElement('div'); card.className = 'goal-card';
            card.innerHTML = `<div class="goal-info"><span>${label}</span><span id="perc-${label}-${isCustom?idx:'std'}">0%</span></div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <input type="number" class="goal-input" value="${target}">
                    <span style="font-size:8px;">${currentCurrency}</span>
                    ${isCustom ? `<span style="color:var(--pixel-red); font-size:7px; cursor:pointer; margin-left:auto;" onclick="removeCG(${idx})">DEL</span>` : ''}
                </div>
                <div class="progress-container"><div class="progress-liquid" id="bar-${label}-${isCustom?idx:'std'}"></div></div>`;
            container.appendChild(card);
            card.querySelector('input').oninput = (e) => {
                const val = parseFloat(e.target.value) || 0;
                if(isCustom) customGoals[idx].target = val; else goalTargets[label] = val;
                saveState(); updateGoalBars();
            };
        }

        function updateGoalBars() {
            const now = new Date();
            const totals = { Daily: 0, Weekly: 0, Monthly: 0, Yearly: 0 };
            logs.forEach(l => {
                const d = new Date(l.date); const amt = parseFloat(l.earnings.replace(/[^\d.-]/g, '')) || 0;
                if (d.toDateString() === now.toDateString()) totals.Daily += amt;
                if (now - d < 7 * 86400000) totals.Weekly += amt;
                if (now - d < 30 * 86400000) totals.Monthly += amt;
                if (now - d < 365 * 86400000) totals.Yearly += amt;
            });
            Object.keys(totals).forEach(k => {
                const p = Math.min(((totals[k] + liveEarnings) / (goalTargets[k] || 1)) * 100, 100);
                if(document.getElementById(`bar-${k}-std`)) { document.getElementById(`bar-${k}-std`).style.width = p + "%"; document.getElementById(`perc-${k}-std`).innerHTML = Math.floor(p) + "%"; }
            });
            customGoals.forEach((cg, i) => {
                let sum = logs.reduce((t, l) => (now - new Date(l.date) < cg.days * 86400000) ? t + (parseFloat(l.earnings.replace(/[^\d.-]/g, '')) || 0) : t, 0);
                const p = Math.min(((sum + liveEarnings) / (cg.target || 1)) * 100, 100);
                const bar = document.getElementById(`bar-${cg.days}D GOAL-${i}`);
                if(bar) { bar.style.width = p + "%"; document.getElementById(`perc-${cg.days}D GOAL-${i}`).innerHTML = Math.floor(p) + "%"; }
            });
        }

        // --- UI TOGGLES ---
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        menuBtn.onclick = () => { sidebar.classList.add('open'); menuBtn.classList.add('hidden'); document.getElementById('sidebar-overlay').style.display='block'; };
        const closeSide = () => { sidebar.classList.remove('open'); menuBtn.classList.remove('hidden'); document.getElementById('sidebar-overlay').style.display='none'; };
        document.getElementById('sidebar-overlay').onclick = closeSide; document.getElementById('close-x').onclick = closeSide;
        document.getElementById('open-settings-btn').onclick = () => document.getElementById('settings-modal').style.display='flex';
        document.getElementById('menu-goals').onclick = () => { document.getElementById('goals-page').style.display = 'flex'; closeSide(); initGoals(); };
        document.getElementById('close-goals').onclick = () => document.getElementById('goals-page').style.display = 'none';
        document.getElementById('add-custom-goal').onclick = () => document.getElementById('custom-goal-modal').style.display = 'flex';
        document.getElementById('tag-toggle-btn').onclick = function() { tagPop = !tagPop; this.innerHTML = tagPop ? "ON" : "OFF"; saveState(); };
        document.getElementById('cg-save').onclick = () => { customGoals.push({ target: parseFloat(document.getElementById('cg-target').value) || 100, days: parseInt(document.getElementById('cg-days').value) || 7 }); saveState(); initGoals(); document.getElementById('custom-goal-modal').style.display='none'; };
        window.removeCG = (i) => { customGoals.splice(i, 1); saveState(); initGoals(); };
        document.getElementById('save-log-btn').onclick = () => { const t = document.getElementById('tag-input'); addEntry(lDur, lEarn, t.value.trim()===""?"no tag":t.value.toUpperCase(), document.getElementById('note-input').value.trim(), new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'})); t.value = ""; };
        function addEntry(d, e, t, n, dt) { logs.push({ id: Date.now(), tag: t, earnings: e, duration: d, date: dt, start: sStart, end: sEnd, note: n }); saveState(); renderLogs(); updateGoalBars(); document.getElementById('log-modal').style.display = 'none'; }
        document.getElementById('confirm-delete-bar').onclick = () => { document.querySelectorAll('.selected-del').forEach(el => { const tag = el.querySelector('span').innerText; logs = logs.filter(l => l.tag !== tag); }); saveState(); renderLogs(); toggleMode('del'); };
        document.getElementById('save-edit-btn').onclick = () => { const log = logs.find(l => l.id === editingId); log.tag = document.getElementById('edit-tag').value; log.date = document.getElementById('edit-date').value; log.start = document.getElementById('edit-start').value; log.end = document.getElementById('edit-end').value; saveState(); renderLogs(); document.getElementById('edit-modal').style.display = 'none'; };
        document.getElementById('currency-select').onchange = (e) => { currentCurrency = e.target.value; document.getElementById('symbol-label').innerHTML = currentCurrency; saveState(); initGoals(); };
    </script>
</body>
</html>
